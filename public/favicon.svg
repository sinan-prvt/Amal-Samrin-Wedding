<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White rounded square background for high visibility on dark mode tabs -->
  <rect x="2" y="2" width="96" height="96" rx="22" ry="22" fill="#ffffff" />
  
  <!-- Elegant Olive Green Circle -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#6b7245" stroke-width="3.5"/>
  
  <!-- Monogram A -->
  <text x="33" y="65" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" font-weight="bold" fill="#991823" text-anchor="middle">A</text>
  
  <!-- Center delicate leaf/diamond motif -->
  <path d="M 50 47 Q 54 52 50 57 Q 46 52 50 47 Z" fill="#6b7245"/>
  
  <!-- Monogram S -->
  <text x="67" y="65" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" font-weight="bold" fill="#991823" text-anchor="middle">S</text>
</svg>
